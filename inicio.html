<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções em Movimento PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="abaco.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f6;      /* Fundo padrão (estilo Streamlit) */
            --container-bg: #ffffff;
            --text-color: #31333f;
            --accent-color: #ff4b4b;   /* Vermelho do Streamlit */
            --input-border: #dcdde1;
        }

        .dark-theme {
            --bg-color: #0e1117;      /* Fundo escuro real do Streamlit */
            --container-bg: #262730;  /* Container escuro */
            --text-color: #fafafa;
            --accent-color: #ff4b4b;
            --input-border: #464855;
        }

        body { 
            font-family: sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { 
            background-color: var(--container-bg); 
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
        }

        /* Menu de Abas */
        .tab-menu { 
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--input-border);
            margin-bottom: 25px;
            gap: 10px;
        }

        .tab-btn { 
            background: none; 
            border: none; 
            padding: 10px 15px; 
            cursor: pointer; 
            color: var(--text-color);
            font-size: 16px;
            opacity: 0.7;
        }

        .tab-btn.active { 
            border-bottom: 3px solid var(--accent-color); 
            font-weight: bold; 
            opacity: 1;
        }

        #theme-toggle {
            margin-left: auto;
            background: var(--input-border);
            border: none;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* Inputs e Layout */
        .controles { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .campo { display: flex; flex-direction: column; }
        
        input {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            padding: 8px;
            border-radius: 5px;
            width: 80px;
            font-size: 16px;
        }

        canvas { width: 100% !important; margin-top: 20px; }
        .tab-content { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="abrirAba(event, 'aba-afim')">Gráfico</button>
        <button class="tab-btn" onclick="abrirAba(event, 'aba-sobre')">Sobre</button>
        <button id="theme-toggle" title="Trocar Tema">🌓</button>
    </div>

    <div id="aba-afim" class="tab-content" style="display: block;">
        <h2>Função Afim: $f(x) = ax + b$</h2>
        
        <div class="controles">
            <div class="campo">
                <label>Coeficiente a:</label>
                <input type="number" id="coefA" value="1" step="0.5" oninput="atualizarGrafico()">
            </div>
            <div class="campo">
                <label>Coeficiente b:</label>
                <input type="number" id="coefB" value="0" step="1" oninput="atualizarGrafico()">
            </div>
        </div>

        <canvas id="meuGrafico"></canvas>
    </div>

    <div id="aba-sobre" class="tab-content">
        <h2>Sobre o Projeto</h2>
        <p>Desenvolvido para o Projeto Multidisciplinar IV.</p>
        <p>Este app funciona totalmente <b>offline</b> como um PWA.</p>
    </div>
</div>

<script src="./grafico1.js"></script>

<script>
    // Registro do Service Worker para o PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
            .then(() => console.log("PWA Ativo!"))
            .catch(err => console.log("Erro PWA:", err));
    }
</script>

</body>
</html>
